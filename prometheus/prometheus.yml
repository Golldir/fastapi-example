global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Конфигурация для сбора метрик с FastAPI приложения
  - job_name: 'order-service'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    
  # Конфигурация для сбора метрик с самого Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
